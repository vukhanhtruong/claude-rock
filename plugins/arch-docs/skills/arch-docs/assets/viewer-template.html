<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- slot:TITLE --></title>
<style>
/* Fonts are local-only: the viewer must render with no network. The design
   carries itself on scale, weight and rhythm rather than a downloaded face. */
:root {
  --font-display: 'Iowan Old Style', 'Charter', 'Bitstream Charter', 'Sitka Text',
                  'Palatino Linotype', Palatino, Georgia, serif;
  --font-body: 'IBM Plex Sans', 'Source Sans 3', 'Segoe UI Variable Text', 'Segoe UI',
               Cantarell, Ubuntu, system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', 'JetBrains Mono', 'SF Mono', 'Cascadia Code',
               'DejaVu Sans Mono', ui-monospace, monospace;

  --bg: #fbfaf7; --surface: #ffffff; --surface-2: #f4f2ec; --surface-3: #edeae1;
  --border: #e3dfd5; --border-strong: #cec8b9;
  --text: #1c1b18; --text-dim: #6b675e; --text-faint: #938f84;
  --accent: #0f766e; --accent-soft: rgba(15, 118, 110, .09); --accent-line: rgba(15, 118, 110, .35);
  --shadow: 0 1px 2px rgba(28, 27, 24, .04), 0 8px 24px -12px rgba(28, 27, 24, .12);

  --rail-w: 292px; --topbar-h: 52px; --measure: 74ch; --measure-wide: 1080px;
  --wide: min(var(--measure-wide), calc(100vw - var(--rail-w) - 80px));
}
/* Dark palette is applied by both the media query and the explicit attribute so
   the toggle wins in either direction. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1211; --surface: #121a19; --surface-2: #0f1716; --surface-3: #16211f;
    --border: #22302e; --border-strong: #354743;
    --text: #e9e7e1; --text-dim: #97a29e; --text-faint: #6d7772;
    --accent: #2dd4bf; --accent-soft: rgba(45, 212, 191, .12); --accent-line: rgba(45, 212, 191, .4);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -14px rgba(0, 0, 0, .7);
  }
}
:root[data-theme="dark"] {
  --bg: #0c1211; --surface: #121a19; --surface-2: #0f1716; --surface-3: #16211f;
  --border: #22302e; --border-strong: #354743;
  --text: #e9e7e1; --text-dim: #97a29e; --text-faint: #6d7772;
  --accent: #2dd4bf; --accent-soft: rgba(45, 212, 191, .12); --accent-line: rgba(45, 212, 191, .4);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -14px rgba(0, 0, 0, .7);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: 16.5px; line-height: 1.7;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-wrap: break-word; counter-reset: doc;
}
::selection { background: var(--accent-soft); }

/* Micro-label: the recurring texture for every piece of metadata. */
.eyebrow {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .18em; color: var(--text-faint);
}

/* ---------- reading progress ---------- */
#progress {
  position: fixed; top: 0; left: 0; height: 2px; width: 0;
  background: var(--accent); z-index: 60; transition: width .1s linear;
}

/* ---------- top bar ---------- */
.topbar {
  position: fixed; top: 0; right: 0; left: var(--rail-w); height: var(--topbar-h);
  display: flex; align-items: center; gap: 12px; padding: 0 24px; z-index: 40;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.crumb {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em;
  color: var(--text-dim); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; flex: 1; min-width: 0;
}
.crumb b { color: var(--text); font-weight: 600; }
.crumb span { color: var(--text-faint); padding: 0 6px; }

.icon-btn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; min-width: 32px; padding: 0 8px; flex-shrink: 0;
  background: transparent; border: 1px solid var(--border); border-radius: 8px;
  color: var(--text-dim); cursor: pointer;
  transition: color .15s, border-color .15s, background .15s,
              scale .12s cubic-bezier(.2, 0, 0, 1);
}
/* The visible chip stays 32px so the bar keeps its scale; the target is 40px.
   The topbar gap is 12px, so the extended areas never touch. */
.icon-btn::after { content: ''; position: absolute; inset: -4px; }
.icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
.icon-btn:active { scale: .96; }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6;
  stroke-linecap: round; stroke-linejoin: round; }
#nav-toggle { display: none; }

/* Both icons stay in the DOM and cross-fade, so the theme switch reads as one
   object turning over rather than two elements popping in and out. */
#theme-toggle { width: 32px; padding: 0; }
#theme-toggle svg {
  position: absolute; top: 50%; left: 50%; margin: -7.5px 0 0 -7.5px;
  transition: opacity .24s cubic-bezier(.2, 0, 0, 1), scale .24s cubic-bezier(.2, 0, 0, 1),
              filter .24s cubic-bezier(.2, 0, 0, 1);
}
.i-sun { opacity: 1; scale: 1; filter: blur(0px); }
.i-moon { opacity: 0; scale: .25; filter: blur(4px); }
:root[data-theme="dark"] .i-sun { opacity: 0; scale: .25; filter: blur(4px); }
:root[data-theme="dark"] .i-moon { opacity: 1; scale: 1; filter: blur(0px); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .i-sun { opacity: 0; scale: .25; filter: blur(4px); }
  :root:not([data-theme="light"]) .i-moon { opacity: 1; scale: 1; filter: blur(0px); }
  :root[data-theme="light"] .i-sun { opacity: 1; scale: 1; filter: blur(0px); }
  :root[data-theme="light"] .i-moon { opacity: 0; scale: .25; filter: blur(4px); }
}

/* ---------- rail ---------- */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--rail-w); z-index: 50;
  display: flex; flex-direction: column;
  background: var(--surface-2); border-right: 1px solid var(--border);
}
.rail-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.rail-mark { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
.rail-mark svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--accent); }
.rail-title {
  font-family: var(--font-display); font-size: 15px; font-weight: 600; line-height: 1.25;
  letter-spacing: -.01em; color: var(--text);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.filter-wrap { position: relative; }
.filter-wrap svg {
  position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
  width: 13px; height: 13px; fill: none; stroke: var(--text-faint); stroke-width: 1.7;
  pointer-events: none;
}
#nav-filter {
  width: 100%; height: 32px; padding: 0 10px 0 28px;
  font-family: var(--font-mono); font-size: 11.5px; color: var(--text);
  background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
  transition: border-color .15s, box-shadow .15s;
}
#nav-filter::placeholder { color: var(--text-faint); }
#nav-filter:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.rail-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 10px 12px 40px; }
.rail-scroll::-webkit-scrollbar { width: 8px; }
.rail-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px;
  border: 2px solid var(--surface-2); }
.rail-scroll::-webkit-scrollbar-track { background: transparent; }

.nav-chevron {
  width: 11px; height: 11px; flex-shrink: 0; color: var(--text-faint);
  transition: rotate .18s cubic-bezier(.2, 0, 0, 1);
}
.nav-sec[open] > .nav-sec__head .nav-chevron,
.nav-group[open] > .nav-group__head .nav-chevron { rotate: 90deg; }

/* Level 1 — one row per source directory. A 17-ADR run collapses to this row. */
.nav-sec + .nav-sec { margin-top: 3px; }
.nav-sec__head, .nav-group__head {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  list-style: none; user-select: none; transition: background .13s;
}
.nav-sec__head::-webkit-details-marker,
.nav-group__head::-webkit-details-marker { display: none; }
.nav-sec__head:hover, .nav-group__head:hover { background: var(--surface-3); }
.nav-sec__head:focus-visible, .nav-group__head:focus-visible {
  outline: 2px solid var(--accent); outline-offset: -2px;
}
.nav-sec__head { min-height: 34px; padding: 0 9px; border-radius: 11px; }
.nav-sec__title {
  flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .16em; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nav-sec[open] > .nav-sec__head .nav-sec__title { color: var(--text); }
.nav-sec.is-current > .nav-sec__head .nav-sec__title { color: var(--accent); }
/* Recessed well: 11px outer radius less its 3px padding gives the 8px document
   rows inside it — concentric, so the corners nest instead of fighting. */
.nav-sec[open] > .nav-sec__body {
  margin-top: 2px; padding: 3px; border-radius: 11px;
  background: var(--bg); border: 1px solid var(--border);
}

/* Level 2 — one row per document. */
.nav-group + .nav-group { margin-top: 1px; }
.nav-group__head { min-height: 32px; padding: 6px 9px; border-radius: 8px; }
.nav-group__title {
  flex: 1; min-width: 0; font-size: 12px; font-weight: 600; letter-spacing: .005em;
  color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Tabular figures: the filter rewrites these counts live, and proportional
   digits make the whole rail twitch sideways on every keystroke. */
.nav-sec__count, .nav-group__count {
  font-family: var(--font-mono); font-size: 9.5px; font-weight: 600;
  font-variant-numeric: tabular-nums; text-align: center; min-width: 22px;
  color: var(--text-faint); background: var(--surface-3);
  border-radius: 20px; padding: 2px 6px; flex-shrink: 0;
}
.nav-sec.is-current > .nav-sec__head .nav-sec__count,
.nav-group.is-current > .nav-group__head .nav-group__count {
  background: var(--accent-soft); color: var(--accent);
}
.nav-group.is-current > .nav-group__head .nav-group__title { color: var(--accent); }

/* Hairline spine so nested links read as one run, like an index. */
.nav-group__body { margin: 2px 0 6px; padding-left: 15px; border-left: 1px solid var(--border); }
.nav-link {
  display: block; position: relative; padding: 5px 9px; margin-left: -1px;
  border-left: 2px solid transparent; border-radius: 0 6px 6px 0;
  font-size: 12.5px; line-height: 1.4; color: var(--text-dim); text-decoration: none;
  transition: color .13s, background .13s, border-color .13s;
}
.nav-link:hover { color: var(--text); background: var(--surface-3); }
.nav-link--sub { padding-left: 20px; font-size: 11.5px; color: var(--text-faint); }
.nav-link--sub::before {
  content: ''; position: absolute; left: 9px; top: 50%; width: 5px; height: 1px;
  background: var(--border-strong);
}
.nav-link.is-active {
  color: var(--accent); background: var(--accent-soft);
  border-left-color: var(--accent); font-weight: 600;
}
.nav-empty {
  display: none; padding: 20px 10px; text-align: center;
  font-family: var(--font-mono); font-size: 11px; color: var(--text-faint);
}
.sidebar.is-filtering :is(.nav-sec__count, .nav-group__count) { display: none; }

/* One staggered reveal on load beats a dozen scattered micro-interactions. */
@keyframes rail-in { from { opacity: 0; translate: 0 6px; } to { opacity: 1; translate: 0 0; } }
.nav-sec { animation: rail-in .32s cubic-bezier(.2, 0, 0, 1) both; }
.nav-sec:nth-child(2) { animation-delay: .06s; }
.nav-sec:nth-child(3) { animation-delay: .12s; }
.nav-sec:nth-child(4) { animation-delay: .18s; }
.nav-sec:nth-child(n + 5) { animation-delay: .24s; }

.scrim { display: none; }

/* ---------- content ---------- */
.main {
  margin-left: var(--rail-w); padding: calc(var(--topbar-h) + 40px) 40px 25vh;
}
.doc { max-width: var(--measure); margin: 0 auto; }
.main :is(h1, h2, h3, h4, h5, h6) { scroll-margin-top: calc(var(--topbar-h) + 20px); }
.diagram-shell, .table-wrap { scroll-margin-top: calc(var(--topbar-h) + 20px); }

/* Document band: each source file announces itself so a 17-document scroll
   stays navigable. The number is a pure-CSS counter. */
.doc-head {
  counter-increment: doc; position: relative;
  margin: 0 0 28px; padding-top: 34px;
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(30px, 3.4vw, 43px); line-height: 1.12; letter-spacing: -.022em;
  text-wrap: balance;
}
.doc-head::before {
  content: 'Document ' counter(doc, decimal-leading-zero);
  display: block; margin-bottom: 14px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .2em; color: var(--accent);
}
.doc-head::after {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 1px;
  background: linear-gradient(to right, var(--border-strong) 0%, var(--border) 45%, transparent 100%);
}
.doc-section:first-child .page:first-child .doc-head { padding-top: 0; }
.doc-section:first-child .page:first-child .doc-head::after { display: none; }
/* A routed record is shown on its own, so the band that separates one document
   from the next in a scroll has nothing to separate it from — and "Document 07"
   is the wrong count for it anyway. The record bar carries "7 of 15" instead. */
.doc-section[data-routed] .doc-head { padding-top: 0; }
.doc-section[data-routed] .doc-head::after,
.doc-section[data-routed] .doc-head::before { display: none; }
.doc-head + p { color: var(--text-dim); font-size: 17.5px; }

.main h2 {
  margin: 58px 0 18px; font-family: var(--font-display); font-weight: 600;
  font-size: 27px; line-height: 1.25; letter-spacing: -.014em;
  padding-bottom: 9px; border-bottom: 1px solid var(--border);
}
/* h3 was 16px against 16.5px body text, so sub-sections read as bold
   paragraphs. It has to outrank the prose to be a level at all. */
.main h3 {
  margin: 40px 0 12px; font-family: var(--font-display);
  font-size: 19.5px; font-weight: 600; line-height: 1.3; letter-spacing: -.008em;
  color: var(--text);
}
.main h4, .main h5, .main h6 {
  margin: 28px 0 8px; font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .11em; color: var(--text-dim);
}
.main :is(h2, h3) + p, .main :is(h4, h5, h6) + p { margin-top: 0; }
/* One line of air between paragraphs; anything less and the column reads as a
   single block with bold interruptions. */
.main p { margin: 0 0 24px; text-wrap: pretty; }
/* Underline with an offset instead of a border: the border sat on the
   descenders of g, y and p in every inline link. */
.main a {
  color: var(--accent); text-decoration: underline;
  text-decoration-color: var(--accent-line); text-decoration-thickness: 1px;
  text-underline-offset: .18em; transition: text-decoration-color .15s;
}
.main a:hover { text-decoration-color: var(--accent); }

/* Landing from a deep link in a 21-document page gives no sense of arrival.
   The mark fades but the rule stays until the reader moves on. */
@keyframes landed { from { background: var(--accent-soft); } to { background: transparent; } }
.main :is(h2, h3):target {
  animation: landed 1.6s cubic-bezier(.2, 0, 0, 1) both;
  box-shadow: -14px 0 0 -12px var(--accent);
}

/* Hover-revealed deep link — this is a reference document people cite. */
.anchor {
  position: absolute; left: -1.05em; width: 1em; text-align: center;
  border: none !important; color: var(--text-faint) !important;
  opacity: 0; transition: opacity .13s; font-weight: 400;
}
.main :is(h2, h3):hover .anchor, .anchor:focus-visible { opacity: 1; }
.main :is(h2, h3) {
  position: relative;
  text-wrap: balance;
}

code {
  font-family: var(--font-mono); font-size: .855em;
  background: var(--surface-3); border-radius: 4px; padding: .1em .38em;
  color: var(--text); word-break: break-word;
}
/* The prose chip is sized for 16.5px body text. On a display heading it
   becomes a grey box heavier than the words beside it — keep the monospace,
   drop the container. */
:is(.doc-head, .main h2, .main h3) code {
  background: none; padding: 0; font-size: .82em; font-weight: inherit;
}
/* Strict `pre`, not `pre-wrap`: these blocks carry directory trees whose
   ├── └── │ connectors only line up while the source line breaks are the only
   line breaks. Long lines scroll sideways instead of reflowing. */
pre {
  font-family: var(--font-mono); font-size: 12.8px; line-height: 1.62;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px 18px; margin: 24px 0; max-height: 30rem; overflow: auto;
  white-space: pre; box-shadow: var(--shadow);
}
/* Prose is measured for 16.5px sans; code renders at 12.8px mono, so a tree or
   a config block overruns the column. Only the blocks that actually overflow
   take the wide track — a two-line snippet stretched to 1080px reads as a
   mistake. The class is set from JS, which is the only place the real
   scrollWidth is known. */
pre.is-wide {
  width: var(--wide);
  margin-left: calc(min(0px, (var(--measure) - var(--wide)) / 2));
}
pre code { white-space: inherit; }
pre code { background: none; padding: 0; font-size: inherit; }
blockquote {
  margin: 24px 0; padding: 14px 18px; border-left: 2px solid var(--accent);
  border-radius: 0 8px 8px 0; background: var(--surface-2); color: var(--text-dim);
}
blockquote > :last-child { margin-bottom: 0; }
hr { border: none; height: 1px; background: var(--border); margin: 48px 0; }

/* ---------- tables ---------- */
/* The card hugs its table. Every table used to take the 1068px wide track, so a
   3x15 index whose content needs 523px was stretched to double that for no
   gain. Script measures natural width and only tables that outgrow the prose
   column get the track — and then only as wide as they actually are. */
.table-wrap {
  margin: 22px 0; border: 1px solid var(--border); border-radius: 10px;
  overflow: hidden; background: var(--surface); box-shadow: var(--shadow);
  width: max-content; max-width: 100%;
}
.table-wrap.is-wide {
  /* The base rule's max-width would clamp the track straight back to the prose
     column, so taking the track means dropping the cap too. */
  max-width: none;
  width: min(var(--tw), var(--wide));
  margin-left: calc(min(0px, (var(--measure) - min(var(--tw), var(--wide))) / 2));
}
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: max-content; font-size: 13.5px; line-height: 1.55; }
th {
  position: sticky; top: 0; z-index: 1; text-align: left; white-space: nowrap;
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .13em; color: var(--text-dim);
  background: var(--surface-2); padding: 11px 15px;
  border-bottom: 1px solid var(--border-strong);
}
td {
  padding: 11px 15px; border-bottom: 1px solid var(--border); vertical-align: top;
  font-variant-numeric: tabular-nums;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background .13s; }
tbody tr:hover { background: var(--surface-2); }
td code { background: var(--accent-soft); color: var(--accent); font-size: 11.5px; }

ul, ol { margin: 0 0 24px; padding-left: 1.4em; }
li { margin-bottom: 8px; }
li:last-child { margin-bottom: 0; }
li > :is(ul, ol) { margin: 8px 0 0; }
li::marker { color: var(--text-faint); }

/* ---------- definition grids ---------- */
/* A two-column table whose right column runs to prose is a definition list, and
   19 rows of hairline dividers is the worst way to show one. Cards stay at the
   prose measure: the win here is scanning, not height, and a third column would
   cost the reading edge. */
.def-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 10px; margin: 22px 0;
}
.def {
  padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); transition: border-color .15s, background .15s;
}
.def:hover { border-color: var(--border-strong); background: var(--surface-2); }
.def dt {
  margin-bottom: 6px; font-family: var(--font-display); font-size: 15px;
  font-weight: 600; letter-spacing: -.006em; color: var(--text); text-wrap: balance;
}
.def dd {
  margin: 0; font-size: 14px; line-height: 1.6; color: var(--text-dim); text-wrap: pretty;
}
.def dd code { font-size: 12px; }

/* A reference to a file the viewer does not contain. Rendered as text rather
   than a link that goes nowhere; mono marks it as a path without borrowing the
   link colour and promising a destination. */
.ext-ref {
  font-family: var(--font-mono); font-size: .88em; color: var(--text-dim);
  border-bottom: 1px dotted var(--border-strong);
}

/* ---------- view tabs ---------- */
.view-tabs { margin: 26px 0; }
.view-tabs__bar {
  display: flex; gap: 2px; padding: 3px; margin-bottom: 10px; overflow-x: auto;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px;
}
/* 11px bar radius less its 3px padding gives 8px tabs — concentric, so the
   selected chip nests instead of fighting the corner it sits in. */
.view-tab {
  position: relative; flex: 0 0 auto; height: 30px; padding: 0 13px;
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  letter-spacing: .04em; color: var(--text-dim); white-space: nowrap;
  background: transparent; border: none; border-radius: 8px; cursor: pointer;
  transition: color .15s, background .15s, scale .12s cubic-bezier(.2, 0, 0, 1);
}

   never overlap. */
.view-tab::after { content: ''; position: absolute; inset: -5px 0; }
.view-tab:hover { color: var(--text); }
.view-tab:active { scale: .96; }
.view-tab[aria-selected="true"] {

}
.view-panel[hidden] { display: none; }
/* Vertical margins only: the shorthand would also reset the breakout's negative
   left margin, pushing a 1068px diagram off the right edge of the viewport. */
.view-tabs .diagram-shell { margin-top: 0; margin-bottom: 0; }

/* ---------- routed sections ---------- */
.doc-section[data-routed] .page[hidden] { display: none; }

   the record, not its heading, or prev/next lands off screen. */
.doc-section[data-routed] .page { scroll-margin-top: calc(var(--topbar-h) + 20px); }
.record-summary {
  margin: 0 0 18px; font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase;
  font-variant-numeric: tabular-nums; color: var(--text-faint);
}
.record-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 28px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
}
.record-chip {
  position: relative; display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 11px; flex-shrink: 0;
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .11em;
  color: var(--text-dim); text-decoration: none; cursor: pointer;
  background: transparent; border: 1px solid var(--border); border-radius: 8px;
  transition: color .15s, border-color .15s, background .15s,
              scale .12s cubic-bezier(.2, 0, 0, 1);
}
.record-chip::after { content: ''; position: absolute; inset: -5px 0; }
.record-chip:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
.record-chip:active { scale: .96; }
.record-chip[aria-disabled="true"] { opacity: .35; pointer-events: none; }
.record-pos {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .11em;
  font-variant-numeric: tabular-nums; color: var(--text-faint);
}
.record-steps { display: flex; gap: 6px; margin-left: auto; }

/* Hiding the records takes them out of reach of the browser's own find, so the
   index searches their text directly. They are still in the DOM — only hidden —
   so this reads the same characters Ctrl+F would have, and can say which
   record matched instead of dropping the reader into an unlabelled slab. */
.record-search { margin: 0 0 14px; }
.record-search input {
  width: 100%; height: 40px; padding: 0 14px;
  font-family: var(--font-body); font-size: 14px; color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  transition: border-color .15s, box-shadow .15s;
}
.record-search input::placeholder { color: var(--text-faint); }
.record-search input:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
.record-hits { display: grid; gap: 6px; margin: 0 0 24px; }
.record-hits:empty { margin: 0; }
.record-hit {
  display: block; padding: 11px 14px; text-decoration: none; color: inherit;
  background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
  transition: border-color .15s, background .15s;
}
.record-hit:hover { border-color: var(--accent-line); background: var(--surface-2); }
.record-hit b {
  display: block; margin-bottom: 3px; font-size: 14px; font-weight: 600; color: var(--text);
}
.record-hit span { font-size: 12.5px; line-height: 1.55; color: var(--text-dim); }
.record-hit mark {
  background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 0 2px;
}

/* ---------- diagrams ---------- */
.diagram-shell {
  position: relative; margin: 26px 0; border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface); box-shadow: var(--shadow);
}

   given — so it always takes the wide track. Tables opt in by measurement. */
.diagram-shell {
  width: var(--wide);
  margin-left: calc(min(0px, (var(--measure) - var(--wide)) / 2));
}
.diagram-shell:fullscreen { width: 100vw; height: 100vh; margin: 0; border: none;
  border-radius: 0; background: var(--bg); }
.diagram-toolbar {
  position: absolute; top: 8px; right: 8px; z-index: 5; display: flex; gap: 1px;
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--border); border-radius: 8px; padding: 3px;
}
.diagram-toolbar button {
  display: inline-flex; align-items: center; justify-content: center;
  width: 27px; height: 27px; padding: 0; border: none; background: transparent;
  color: var(--text-dim); cursor: pointer; border-radius: 5px;
  font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; letter-spacing: .02em;
  transition: background .13s, color .13s;
}
.diagram-toolbar button:hover { background: var(--surface-3); color: var(--text); }
.diagram-toolbar button:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
.diagram-toolbar svg { width: 14px; height: 14px; fill: none; stroke: currentColor;
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.diagram-toolbar [data-exit-fullscreen] { display: none; }
.diagram-shell:fullscreen [data-exit-fullscreen] { display: inline-flex; }
.diagram-viewport {
  overflow: hidden; min-height: 320px; display: flex; align-items: center;
  justify-content: center; cursor: grab; padding: 20px;
}
.diagram-shell:fullscreen .diagram-viewport { height: 100vh; }
.diagram-viewport.is-panning { cursor: grabbing; user-select: none; }
.diagram-canvas { transform-origin: center; }
.diagram-shell.is-expanded {
  position: fixed; inset: 20px; width: auto; margin: 0; z-index: 100;
  box-shadow: 0 24px 70px -18px rgba(0, 0, 0, .5);
}
.diagram-shell.is-expanded .diagram-viewport { height: calc(100% - 12px); }

/* LikeC4 fits its view to the box it is given. Without an explicit one the
   webcomponent collapses to a thumbnail in the middle of an empty shell. */
.diagram-shell.is-c4 .diagram-canvas,
.diagram-shell.is-mermaid .diagram-canvas { width: 100%; }
.diagram-shell.is-mermaid .mermaid-canvas { display: flex; justify-content: center; }
.diagram-shell.is-c4 .diagram-viewport { padding: 0; }
c4-view { display: block; width: 100%; height: 460px; }
.diagram-shell.is-c4:fullscreen c4-view,
.diagram-shell.is-c4.is-expanded c4-view { height: 100%; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) { :root { --measure: 68ch; } }
@media (max-width: 960px) {
  :root { --rail-w: 300px; --measure: 100%; }
  .topbar { left: 0; padding: 0 14px; }
  #nav-toggle { display: inline-flex; }
  .sidebar {
    transform: translateX(-100%); transition: transform .26s cubic-bezier(.4, 0, .2, 1);
    box-shadow: none;
  }
  .sidebar.is-open { transform: translateX(0); box-shadow: 0 0 60px rgba(0, 0, 0, .3); }
  .scrim {
    display: block; position: fixed; inset: 0; z-index: 45; background: rgba(10, 12, 12, .5);
    opacity: 0; pointer-events: none; transition: opacity .26s;
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  .scrim.is-open { opacity: 1; pointer-events: auto; }
  .main { margin-left: 0; padding: calc(var(--topbar-h) + 26px) 18px 20vh; }
  /* .is-wide outranks .table-wrap on specificity, so it has to be named here
     or a measured-wide table keeps its desktop track on a phone. */
  .diagram-shell, .table-wrap, .table-wrap.is-wide { width: 100%; margin-left: 0; }
  .doc-head { font-size: clamp(26px, 7vw, 34px); }
  .main h2 { font-size: 21px; margin-top: 40px; }
  body { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }

    animation-duration: .01ms !important; transition-duration: .01ms !important;
  }

  .sidebar, .topbar, .scrim, #progress, .diagram-toolbar { display: none; }
  .main { margin: 0; padding: 0; }
}

<script>
/* Mirrors <title> into the rail so TITLE stays a single template slot, and so

<script type="module"><!-- slot:LIKEC4_BUNDLE --></script>

<script type="module">
window.ARCH_DOCS_THEME = <!-- slot:THEME -->;
<!-- slot:MERMAID_BUNDLE -->
var root = document.documentElement;

function isDark() {
  var set = root.getAttribute('data-theme');
  return set ? set === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}

/* Mermaid bakes colours into the SVG at render time, so the palette has to be
   chosen before rendering and the diagrams re-rendered whenever it changes. */
function initMermaid() {
  var t = window.ARCH_DOCS_THEME;
  mermaid.initialize({
    theme: 'base',
    themeVariables: isDark() && t.dark ? t.dark : t.themeVariables,
    layout: 'elk',
  });
}
mermaid.registerLayoutLoaders(elkLayouts);
initMermaid();

var sidebar = document.getElementById('sidebar');
var scrim = document.getElementById('scrim');
var navToggle = document.getElementById('nav-toggle');

document.getElementById('theme-toggle').addEventListener('click', function () {
  var next = isDark() ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  localStorage.setItem('arch-docs-theme', next);
  initMermaid();
  rerenderDiagrams();
});

function setDrawer(open) {
  sidebar.classList.toggle('is-open', open);
  scrim.classList.toggle('is-open', open);
  navToggle.setAttribute('aria-expanded', String(open));
}
navToggle.addEventListener('click', function () { setDrawer(!sidebar.classList.contains('is-open')); });
scrim.addEventListener('click', function () { setDrawer(false); });
addEventListener('keydown', function (e) { if (e.key === 'Escape') setDrawer(false); });

/* ---- reading progress ---- */
var progress = document.getElementById('progress');
addEventListener('scroll', function () {
  var max = document.body.scrollHeight - innerHeight;
  progress.style.width = (max > 0 ? (scrollY / max) * 100 : 0) + '%';
}, { passive: true });

/* ---- deep-link anchors on every section heading ---- */
document.querySelectorAll('.doc h2[id], .doc h3[id]').forEach(function (h) {
  var a = document.createElement('a');
  a.className = 'anchor';
  a.href = '#' + h.id;
  a.textContent = '#';
  a.setAttribute('aria-label', 'Link to ' + h.textContent);
  h.prepend(a);
});

/* ---- tables get a scroll container so wide rows never blow out the column ---- */
document.querySelectorAll('.doc table').forEach(function (t) {
  var wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  var scroll = document.createElement('div');
  scroll.className = 'table-scroll';
  t.replaceWith(wrap);
  wrap.appendChild(scroll);
  scroll.appendChild(t);
});

/* ---- code blocks: only the ones that overflow take the wide track ---- */
var pres = [].slice.call(document.querySelectorAll('.doc pre'));
function sizeCode() {
  pres.forEach(function (p) {
    p.classList.remove('is-wide');
    if (p.scrollWidth > p.clientWidth) p.classList.add('is-wide');
  });
}
sizeCode();

/* ---- tables: the same rule, measured against the prose column ---- */
var wraps = [].slice.call(document.querySelectorAll('.doc .table-wrap'));
function sizeTables() {
  var room = document.querySelector('.doc').clientWidth;
  wraps.forEach(function (w) {
    /* A hidden record measures 0, which would read as "fits". Leave it alone
       until it is on screen; it was measured correctly before routing ran. */
    if (w.offsetParent === null) return;
    var table = w.querySelector('table');
    var natural = Math.max(table.offsetWidth, table.scrollWidth);
    w.style.setProperty('--tw', natural + 'px');
    w.classList.toggle('is-wide', natural > room);
  });
}
sizeTables();
addEventListener('resize', function () { sizeCode(); sizeTables(); });

/* ---- view tabs: one system at several zoom levels, one panel at a time ---- */
document.querySelectorAll('.view-tabs').forEach(function (group) {
  var tabs = [].slice.call(group.querySelectorAll('.view-tab'));
  var panels = [].slice.call(group.querySelectorAll('.view-panel'));
  function select(n, focus) {
    tabs.forEach(function (t, i) {
      t.setAttribute('aria-selected', String(i === n));
      t.tabIndex = i === n ? 0 : -1;
    });
    panels.forEach(function (p, i) { p.hidden = i !== n; });
    if (focus) tabs[n].focus();
    dispatchEvent(new Event('resize'));
  }
  tabs.forEach(function (tab, i) {
    tab.addEventListener('click', function () { select(i, false); });
    tab.addEventListener('keydown', function (e) {
      var step = e.key === 'ArrowRight' ? 1 : (e.key === 'ArrowLeft' ? -1 : 0);
      if (!step) return;
      e.preventDefault();
      select((i + step + tabs.length) % tabs.length, true);
    });
  });

/* ---- rail: filter ---- */
var filter = document.getElementById('nav-filter');
var sections = [].slice.call(document.querySelectorAll('.nav-sec'));
var groups = [].slice.call(document.querySelectorAll('.nav-group'));
var navEmpty = document.getElementById('nav-empty');

function titleOf(el, cls) { return el.querySelector(cls).textContent.toLowerCase(); }

/* Filtering force-opens whatever it hits, so the reader's own open/closed
   layout is stashed on the elements and restored when the box is cleared. */
function stashOpen() {
  sections.concat(groups).forEach(function (d) { d.dataset.wasOpen = d.open ? '1' : '0'; });
}
function restoreOpen(d) {
  if ('wasOpen' in d.dataset) d.open = d.dataset.wasOpen === '1';
}

function filterGroup(g, q) {
  var links = [].slice.call(g.querySelectorAll('.nav-link'));
  var hit = Boolean(q) && titleOf(g, '.nav-group__title').indexOf(q) !== -1;
  var found = 0;
  links.forEach(function (a) {
    var show = !q || hit || a.dataset.label.indexOf(q) !== -1;
    a.style.display = show ? '' : 'none';
    if (show) found += 1;
  });
  g.style.display = !q || found || hit ? '' : 'none';
  if (q) g.open = Boolean(found || hit); else restoreOpen(g);
  return found || (hit ? 1 : 0);
}

function filterSection(sec, q) {
  var hit = Boolean(q) && titleOf(sec, '.nav-sec__title').indexOf(q) !== -1;
  var found = 0;
  [].slice.call(sec.querySelectorAll('.nav-group')).forEach(function (g) {
    found += filterGroup(g, hit ? '' : q);
  });
  sec.style.display = !q || found || hit ? '' : 'none';
  if (q) sec.open = Boolean(found || hit); else restoreOpen(sec);
  return found;
}

var stashed = false;
filter.addEventListener('input', function () {
  var q = filter.value.trim().toLowerCase();
  if (q && !stashed) { stashOpen(); stashed = true; }
  sidebar.classList.toggle('is-filtering', Boolean(q));
  var hits = 0;
  sections.forEach(function (sec) { hits += filterSection(sec, q); });
  navEmpty.style.display = q && !hits ? 'block' : 'none';
  if (!q) stashed = false;

/* ---- rail: scroll spy ---- */
var links = [].slice.call(document.querySelectorAll('.nav-link'));
var byId = {};
var targets = [];
links.forEach(function (a) {
  var el = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
  if (!el) return;
  byId[el.id] = a;
  targets.push(el);
});
document.querySelectorAll('.doc .doc-head[id]').forEach(function (el) { targets.push(el); });

var crumb = document.getElementById('crumb');
var current = null;

function setCrumb(parts) {
  crumb.innerHTML = '';
  parts.filter(Boolean).forEach(function (part, i) {
    if (i) crumb.appendChild(Object.assign(document.createElement('span'), { textContent: '/' }));
    crumb.appendChild(part.strong
      ? Object.assign(document.createElement('b'), { textContent: part.text })
      : document.createTextNode(part.text));
  });
}

function activate(el) {
  if (el === current) return;
  current = el;
  var a = byId[el.id];
  links.forEach(function (l) { l.classList.remove('is-active'); });
  groups.forEach(function (g) { g.classList.remove('is-current'); });
  sections.forEach(function (s) { s.classList.remove('is-current'); });

  var group = a ? a.closest('.nav-group')
    : document.querySelector('.nav-group[data-doc="' + CSS.escape(el.id) + '"]');
  var sec = group ? group.closest('.nav-sec') : null;
  // A hit inside a collapsed section is invisible, so open both levels.
  if (sec) { sec.classList.add('is-current'); if (!filter.value) sec.open = true; }
  if (group) {
    group.classList.add('is-current');
    if (!filter.value) group.open = true;
  }
  if (a) {
    a.classList.add('is-active');
    if (innerWidth > 960) a.scrollIntoView({ block: 'nearest' });
  }
  setCrumb([
    sec && { text: sec.querySelector('.nav-sec__title').textContent },
    group && { text: group.querySelector('.nav-group__title').textContent, strong: true },
    a && { text: a.textContent },

var visible = new Set();
var spy = new IntersectionObserver(function (entries) {
  entries.forEach(function (e) {
    if (e.isIntersecting) visible.add(e.target); else visible.delete(e.target);

  if (ordered.length) activate(ordered[0]);

targets.forEach(function (t) { spy.observe(t); });

links.forEach(function (a) {
  a.addEventListener('click', function () { if (innerWidth <= 960) setDrawer(false); });
});

/* ---- routed sections ----

   row, the index holds the list, and one record shows at a time. The records
   stay in the DOM either way, which is what lets the index search their text
   after hiding them from the browser's own find. */
var routed = [].slice.call(document.querySelectorAll('.doc-section[data-routed]'));
var bodyText = new Map();

function pagesOf(sec) { return [].slice.call(sec.children); }

function recordsOf(sec) {
  var landing = document.getElementById(sec.dataset.landing);
  return pagesOf(sec).filter(function (p) { return p !== landing; });
}

function chip(label, href, flag) {
  var a = document.createElement('a');
  a.className = 'record-chip';
  a.textContent = label;
  if (href) a.href = '#' + href;
  else a.setAttribute('aria-disabled', 'true');
  if (flag) a.setAttribute(flag, '');

function stepsEl(records, i) {
  var steps = document.createElement('div');
  steps.className = 'record-steps';
  steps.appendChild(chip('‹ Prev', records[i - 1] && records[i - 1].id, 'data-prev'));
  steps.appendChild(chip('Next ›', records[i + 1] && records[i + 1].id, 'data-next'));
  return steps;
}

function barEl(records, i, landingId) {
  var bar = document.createElement('div');
  bar.className = 'record-bar';
  bar.appendChild(chip('‹ All records', landingId, 'data-back'));
  var pos = document.createElement('span');
  pos.className = 'record-pos';
  pos.textContent = (i + 1) + ' / ' + records.length;
  bar.append(pos, stepsEl(records, i));
  return bar;
}

function snippetEl(text, q) {
  var at = text.toLowerCase().indexOf(q);
  var body = document.createElement('span');
  var mark = document.createElement('mark');
  mark.textContent = text.slice(at, at + q.length);
  body.append('…' + text.slice(Math.max(0, at - 55), at), mark,
    text.slice(at + q.length, at + q.length + 95) + '…');
  return body;
}

function hitEl(page, q) {
  var a = document.createElement('a');
  a.className = 'record-hit';
  a.href = '#' + page.id;
  var title = document.createElement('b');
  title.textContent = page.dataset.title;
  a.append(title, snippetEl(bodyText.get(page), q));
  return a;
}

function searchEl(records, hits) {
  var box = document.createElement('div');
  box.className = 'record-search';
  var input = document.createElement('input');
  input.type = 'search';
  input.setAttribute('aria-label', 'Search the full text of every record');
  input.placeholder = 'Search all ' + records.length + ' records…';
  box.appendChild(input);
  input.addEventListener('input', function () {
    var q = input.value.trim().toLowerCase();
    hits.textContent = '';
    if (q.length < 2) return;
    records.forEach(function (p) {
      if (bodyText.get(p).toLowerCase().indexOf(q) !== -1) hits.appendChild(hitEl(p, q));
    });
  });
  return box;
}

/* Each record states its own status under a Status heading, so the index can
   total them without the renderer having to parse anything. The deep-link
   anchor prepends a '#' to every heading, hence the strip. */
/* Only the leading word. A real status line carries its qualifiers with it —
   "Accepted — partially supersedes ADR-0008 (the src/kit/ line only)" — and
   tallying the whole string gives one bucket per record instead of a total. */
function statusHeadOf(page) {
  var head = [].slice.call(page.querySelectorAll('h2')).filter(function (h) {
    return h.textContent.replace('#', '').trim().toLowerCase() === 'status';
  })[0];
  var body = head && head.nextElementSibling;
  return body && body.tagName === 'P' ? body.textContent.trim() : '';
}

function statusOf(page) {
  var text = statusHeadOf(page);
  if (text) return (text.match(/^[A-Za-z]+/) || [''])[0].toLowerCase();
  /* Not every record uses a Status heading: one writes "**Status:** Accepted" as
     an inline label in its header block. Only the opening of the record is
     searched, so a later mention of the word cannot be mistaken for the field. */
  var label = page.textContent.slice(0, 700).match(/Status:\s*([A-Za-z]+)/);
  return label ? label[1].toLowerCase() : '';
}

function summaryEl(records) {
  var tally = new Map();
  records.forEach(function (p) {
    var status = statusOf(p) || 'unrecorded';
    tally.set(status, (tally.get(status) || 0) + 1);
  });
  var parts = Array.from(tally).sort(function (a, b) { return b[1] - a[1]; });
  var el = document.createElement('p');
  el.className = 'record-summary';
  el.textContent = records.length + ' records · ' + parts.map(function (e) {
    return e[1] + ' ' + e[0];
  }).join(' · ');
  return el;
}

function equipSection(sec) {
  var records = recordsOf(sec);
  records.forEach(function (p) { bodyText.set(p, p.textContent.replace(/\s+/g, ' ')); });
  records.forEach(function (p, i) { p.prepend(barEl(records, i, sec.dataset.landing)); });
  var landing = document.getElementById(sec.dataset.landing);
  var hits = document.createElement('div');
  hits.className = 'record-hits';
  /* The index's own opening paragraph explains what the records are, so it keeps
     its place directly under the title; the controls go below it. */
  var head = landing.querySelector('.doc-head');
  var lead = head.nextElementSibling;
  var at = lead && lead.tagName === 'P' ? lead : head;
  at.after(hits);
  at.after(searchEl(records, hits));
  at.after(summaryEl(records));
}

function routeTo(sec, page) {
  pagesOf(sec).forEach(function (p) { p.hidden = p !== page; });
}

function syncRoutes() {
  var id = decodeURIComponent((location.hash || '').slice(1));
  var el = id && document.getElementById(id);
  var target = el && el.closest('.page');
  routed.forEach(function (sec) {
    var want = target && target.parentNode === sec
      ? target : document.getElementById(sec.dataset.landing);
    routeTo(sec, want);
  });
  return el;
}

/* The browser scrolls to a fragment before the router can reveal it, so a deep
   link into a hidden record lands nowhere. Re-run the jump once it is shown. */
function syncAndJump() {
  var el = syncRoutes();
  sizeTables();
  if (!el) return;
  /* A link to the record itself scrolls to the record, so its bar is on screen.
     A link to a heading inside the record still lands on that heading. */
  var page = el.closest('.page');
  var inRouted = page && page.parentNode.dataset.routed !== undefined;
  (inRouted && el.classList.contains('doc-head') ? page : el).scrollIntoView();
}

if (routed.length) {
  routed.forEach(equipSection);
  addEventListener('hashchange', syncAndJump);
  syncRoutes();
  if (location.hash) syncAndJump();
  sizeTables();
}

/* ---- diagrams ---- */
var mermaidEls = [];
function rerenderDiagrams() { mermaidEls.forEach(renderMermaid); }

async function renderMermaid(el) {
  var code = el.dataset.src || el.textContent.trim();
  if (!code) return;
  el.dataset.src = code;
  var id = 'd' + Math.random().toString(36).slice(2);
  var out = await mermaid.render(id, code);
  var svg = new DOMParser().parseFromString(out.svg, 'text/html').body.querySelector('svg');
  if (!svg) return;
  // Mermaid pins the SVG to its natural width (~300px for an ER diagram), which
  // leaves labels unreadable in a full-width shell. The viewBox lets it scale.
  if (svg.getAttribute('viewBox')) {
    svg.removeAttribute('width');
    svg.removeAttribute('height');
    svg.style.width = '100%';
    svg.style.height = 'auto';
    svg.style.maxWidth = '100%';
    svg.style.maxHeight = '72vh';
  }
  el.replaceChildren(svg);
}

var ICONS = {
  'zoom-in': '<svg viewBox="0 0 18 18"><circle cx="7.8" cy="7.8" r="5"/><path d="M11.4 11.4 16 16M7.8 5.8v4M5.8 7.8h4"/></svg>',
  'zoom-out': '<svg viewBox="0 0 18 18"><circle cx="7.8" cy="7.8" r="5"/><path d="M11.4 11.4 16 16M5.8 7.8h4"/></svg>',
  'expand': '<svg viewBox="0 0 18 18"><path d="M11 2h5v5M7 16H2v-5M16 2l-6 6M2 16l6-6"/></svg>',
  'fullscreen': '<svg viewBox="0 0 18 18"><path d="M2 6.5V2h4.5M11.5 2H16v4.5M16 11.5V16h-4.5M6.5 16H2v-4.5"/></svg>',
  'exit': '<svg viewBox="0 0 18 18"><path d="M6.5 2v4.5H2M16 6.5h-4.5V2M11.5 16v-4.5H16M2 11.5h4.5V16"/></svg>',
};

function buildToolbar() {
  var t = document.createElement('div');
  t.className = 'diagram-toolbar';
  t.innerHTML =
    '<button type="button" data-zoom-in aria-label="Zoom in" title="Zoom in">' + ICONS['zoom-in'] + '</button>' +
    '<button type="button" data-zoom-out aria-label="Zoom out" title="Zoom out">' + ICONS['zoom-out'] + '</button>' +
    '<button type="button" data-zoom-reset aria-label="Reset zoom" title="Reset zoom">1:1</button>' +
    '<button type="button" data-expand aria-label="Expand" title="Expand">' + ICONS.expand + '</button>' +
    '<button type="button" data-fullscreen aria-label="Fullscreen" title="Fullscreen">' + ICONS.fullscreen + '</button>' +
    '<button type="button" data-exit-fullscreen aria-label="Exit fullscreen" title="Exit fullscreen">' + ICONS.exit + '</button>';
  return t;
}

function wireDiagram(shell) {
  var toolbar = buildToolbar();
  var viewport = document.createElement('div');
  viewport.className = 'diagram-viewport';
  var canvas = document.createElement('div');
  canvas.className = 'diagram-canvas';
  var content = shell.firstElementChild;
  shell.replaceChildren(toolbar, viewport);
  viewport.appendChild(canvas);
  canvas.appendChild(content);

  var zoom = 1, panX = 0, panY = 0, drag = null;
  function apply() { canvas.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')'; }
  function zoomBy(f) { zoom = Math.min(4, Math.max(0.25, zoom * f)); apply(); }

  toolbar.querySelector('[data-zoom-in]').onclick = function () { zoomBy(1.2); };
  toolbar.querySelector('[data-zoom-out]').onclick = function () { zoomBy(1 / 1.2); };
  toolbar.querySelector('[data-zoom-reset]').onclick = function () { zoom = 1; panX = 0; panY = 0; apply(); };
  toolbar.querySelector('[data-expand]').onclick = function () { shell.classList.toggle('is-expanded'); };
  toolbar.querySelector('[data-fullscreen]').onclick = function () { shell.requestFullscreen().catch(function () {}); };
  toolbar.querySelector('[data-exit-fullscreen]').onclick = function () { document.exitFullscreen(); };

  viewport.addEventListener('wheel', function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.1 : 1 / 1.1);
  }, { passive: false });

  viewport.addEventListener('mousedown', function (e) {
    if (e.target.closest('.diagram-toolbar')) return;
    drag = { x: e.clientX - panX, y: e.clientY - panY };
    viewport.classList.add('is-panning');
  });
  addEventListener('mousemove', function (e) {
    if (!drag) return;
    panX = e.clientX - drag.x;
    panY = e.clientY - drag.y;
    apply();
  });
  addEventListener('mouseup', function () { drag = null; viewport.classList.remove('is-panning'); });

  if (canvas.querySelector('c4-view')) shell.classList.add('is-c4');
  var mermaidEl = canvas.querySelector('.mermaid-canvas');
  if (mermaidEl) {
    shell.classList.add('is-mermaid');
    mermaidEls.push(mermaidEl);
    renderMermaid(mermaidEl);
  }
}

document.querySelectorAll('.diagram-shell').forEach(wireDiagram);
</script>
</body>
