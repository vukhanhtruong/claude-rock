<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- slot:TITLE --></title>
<style>
@font-face { font-family: 'IBM Plex Sans'; src: local('IBM Plex Sans'); font-display: swap; }
@font-face { font-family: 'IBM Plex Mono'; src: local('IBM Plex Mono'); font-display: swap; }

:root {
  --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --bg: #ffffff; --surface: #f8fafc; --border: #e2e8f0;
  --text: #0f172a; --text-dim: #475569;
  --accent: #0f766e; --accent-2: #475569;
  --sidebar-w: 260px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f172a; --surface: #1e293b; --border: #334155; --text: #e2e8f0; --text-dim: #94a3b8; }
}
:root[data-theme="dark"] { --bg: #0f172a; --surface: #1e293b; --border: #334155; --text: #e2e8f0; --text-dim: #94a3b8; }
:root[data-theme="light"] { --bg: #ffffff; --surface: #f8fafc; --border: #e2e8f0; --text: #0f172a; --text-dim: #475569; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
code, pre { font-family: var(--font-mono); }
a { color: var(--accent); }

.theme-toggle {
  position: fixed; top: 10px; right: 12px; z-index: 20; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 6px 10px; font-family: var(--font-mono); font-size: 12px;
}
.app { display: flex; }
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w); overflow-y: auto;
  border-right: 1px solid var(--border); background: var(--surface); padding: 20px 16px;
}
.sidebar a { display: block; color: var(--text-dim); text-decoration: none; padding: 4px 0; font-size: 13px; }
.sidebar a:hover { color: var(--accent); }
.main { margin-left: var(--sidebar-w); padding: 48px 40px; max-width: 860px; }
table { border-collapse: collapse; width: 100%; margin: 12px 0; }
th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; font-size: 13px; }

.diagram-shell { position: relative; border: 1px solid var(--border); border-radius: 8px; margin: 20px 0; background: var(--surface); }
.diagram-shell:fullscreen { width: 100vw; height: 100vh; background: var(--bg); }
.diagram-toolbar {
  position: absolute; top: 6px; right: 6px; z-index: 5; display: flex; gap: 2px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px;
}
.diagram-toolbar button {
  height: 26px; padding: 0 8px; border: none; background: transparent; color: var(--text-dim);
  font-family: var(--font-mono); font-size: 12px; cursor: pointer; border-radius: 4px;
}
.diagram-toolbar button:hover { background: var(--border); color: var(--text); }
.diagram-toolbar [data-exit-fullscreen] { display: none; }
.diagram-shell:fullscreen [data-exit-fullscreen] { display: inline-flex; align-items: center; justify-content: center; }
.diagram-viewport {
  overflow: hidden; min-height: 280px; display: flex; align-items: center; justify-content: center; cursor: grab;
}
.diagram-shell:fullscreen .diagram-viewport { height: 100vh; }
.diagram-viewport.is-panning { cursor: grabbing; }
.diagram-canvas { transform-origin: center; }
.diagram-shell.is-expanded { position: fixed; inset: 24px; z-index: 100; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.diagram-shell.is-expanded .diagram-viewport { height: calc(100% - 12px); }
</style>
</head>
<body>
<script>
(function () {
  var stored = localStorage.getItem('arch-docs-theme');
  if (stored) document.documentElement.setAttribute('data-theme', stored);
})();
</script>
<button class="theme-toggle" id="theme-toggle" type="button" title="Toggle dark/light">theme</button>
<div class="app">
  <nav class="sidebar"><!-- slot:NAV --></nav>
  <main class="main"><!-- slot:DOC --></main>
</div>

<script type="module"><!-- slot:LIKEC4_BUNDLE --></script>

<script type="module">
window.ARCH_DOCS_THEME = <!-- slot:THEME -->;
<!-- slot:MERMAID_BUNDLE -->
mermaid.registerLayoutLoaders(elkLayouts);
mermaid.initialize({ theme: 'base', themeVariables: window.ARCH_DOCS_THEME.themeVariables, layout: 'elk' });

document.getElementById('theme-toggle').addEventListener('click', function () {
  var root = document.documentElement;
  var isDark = root.getAttribute('data-theme') === 'dark'
    || (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  var next = isDark ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  localStorage.setItem('arch-docs-theme', next);
});

async function renderMermaid(el) {
  var code = el.textContent.trim();
  if (!code) return;
  var id = 'd' + Math.random().toString(36).slice(2);
  var out = await mermaid.render(id, code);
  var svg = new DOMParser().parseFromString(out.svg, 'text/html').body.querySelector('svg');
  if (svg) el.replaceChildren(svg);
}

function wireDiagram(shell) {
  var toolbar = document.createElement('div');
  toolbar.className = 'diagram-toolbar';
  toolbar.innerHTML =
    '<button data-zoom-in title="Zoom in">+</button>' +
    '<button data-zoom-out title="Zoom out">-</button>' +
    '<button data-zoom-reset title="Reset zoom">1:1</button>' +
    '<button data-expand title="Expand">Exp</button>' +
    '<button data-fullscreen title="Fullscreen">FS</button>' +
    '<button data-exit-fullscreen title="Exit fullscreen">X</button>';
  var viewport = document.createElement('div');
  viewport.className = 'diagram-viewport';
  var canvas = document.createElement('div');
  canvas.className = 'diagram-canvas';
  var content = shell.firstElementChild;
  shell.replaceChildren(toolbar, viewport);
  viewport.appendChild(canvas);
  canvas.appendChild(content);

  var zoom = 1, panX = 0, panY = 0, drag = null;
  function apply() { canvas.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')'; }
  function zoomBy(f) { zoom = Math.min(4, Math.max(0.25, zoom * f)); apply(); }

  toolbar.querySelector('[data-zoom-in]').onclick = function () { zoomBy(1.2); };
  toolbar.querySelector('[data-zoom-out]').onclick = function () { zoomBy(1 / 1.2); };
  toolbar.querySelector('[data-zoom-reset]').onclick = function () { zoom = 1; panX = 0; panY = 0; apply(); };
  toolbar.querySelector('[data-expand]').onclick = function () { shell.classList.toggle('is-expanded'); };
  toolbar.querySelector('[data-fullscreen]').onclick = function () { shell.requestFullscreen().catch(function () {}); };
  toolbar.querySelector('[data-exit-fullscreen]').onclick = function () { document.exitFullscreen(); };

  viewport.addEventListener('wheel', function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.1 : 1 / 1.1);
  }, { passive: false });

  viewport.addEventListener('mousedown', function (e) {
    if (e.target.closest('.diagram-toolbar')) return;
    drag = { x: e.clientX - panX, y: e.clientY - panY };
    viewport.classList.add('is-panning');
  });
  addEventListener('mousemove', function (e) {
    if (!drag) return;
    panX = e.clientX - drag.x;
    panY = e.clientY - drag.y;
    apply();
  });
  addEventListener('mouseup', function () { drag = null; viewport.classList.remove('is-panning'); });

  var mermaidEl = canvas.querySelector('.mermaid-canvas');
  if (mermaidEl) renderMermaid(mermaidEl);
}

document.querySelectorAll('.diagram-shell').forEach(wireDiagram);
</script>
</body>
</html>
