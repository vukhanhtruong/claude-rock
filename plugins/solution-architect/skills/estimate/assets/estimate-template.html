<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- slot:TITLE --> — Estimate</title>
<style>
<!-- slot:FONTS -->
:root {
  --bg:#faf9f6; --ink:#1a1a1a; --accent:#0f766e; --warn:#b45309; --bad:#b91c1c; --ok:#15803d; --card:#fff;
  --border:#e3dfd5; --border-strong:#cec8b9; --ink-dim:#6b675e;
}
:root[data-theme="dark"] {
  --bg:#111312; --ink:#e8e6e1; --card:#1c1f1e;
  --border:#22302e; --border-strong:#354743; --ink-dim:#97a29e;
}
* { box-sizing: border-box; }
body {
  font-family:'IBM Plex Sans',system-ui,sans-serif; background:var(--bg); color:var(--ink);
  margin:0; line-height:1.5;
}
/* layout: header bar, two-column grid (main charts | controls rail), full-width feature table */
header {
  display:flex; align-items:center; gap:.75rem; padding:.9rem 1.5rem;
  border-bottom:1px solid var(--border); background:var(--card);
}
header h1 { font-size:1.1rem; margin:0; flex:1; }
#confidence-badge {
  font-family:'IBM Plex Mono',monospace; font-size:.75rem; text-transform:uppercase;
  padding:.15rem .5rem; border-radius:.25rem; border:1px solid var(--border-strong);
}
#confidence-badge.high { color:var(--ok); border-color:var(--ok); }
#confidence-badge.med { color:var(--warn); border-color:var(--warn); }
#confidence-badge.low { color:var(--bad); border-color:var(--bad); }
header button {
  font-family:inherit; font-size:.8rem; padding:.35rem .7rem; border-radius:.3rem;
  border:1px solid var(--border-strong); background:var(--card); color:var(--ink); cursor:pointer;
}
#modified-banner {
  margin:0; padding:.5rem 1.5rem; background:var(--warn); color:#fff; font-size:.85rem;
}
#modified-banner button { margin-left:.5rem; }
main {
  display:grid; grid-template-columns:1fr 280px; gap:1.25rem; padding:1.25rem 1.5rem;
}
#scenario-cards, #cost-bars, #timeline { grid-column:1; }
#feature-table, #register { grid-column:1 / -1; }
#controls {
  grid-column:2; grid-row:1 / span 3; align-self:start;
  background:var(--card); border:1px solid var(--border); border-radius:.5rem;
  padding:1rem; display:flex; flex-direction:column; gap:.75rem;
}
#controls label { display:flex; flex-direction:column; font-size:.8rem; gap:.25rem; color:var(--ink-dim); }
#controls input, #controls select { font:inherit; padding:.3rem; border:1px solid var(--border-strong); border-radius:.3rem; background:var(--bg); color:var(--ink); }
.card {
  background:var(--card); border:1px solid var(--border); border-radius:.5rem;
  padding:1rem; margin-bottom:.75rem;
}
/* bars and gantt rows are styled divs — width set inline from data, no canvas, printable */
.bar-row { display:flex; align-items:center; gap:.5rem; margin-bottom:.4rem; }
.bar-label { flex:0 0 140px; font-size:.8rem; color:var(--ink-dim); }
.bar-track { flex:1; height:.9rem; background:var(--border); border-radius:.25rem; overflow:hidden; }
.bar-fill { height:100%; background:var(--accent); }
table { width:100%; border-collapse:collapse; font-size:.85rem; }
table th, table td { text-align:left; padding:.4rem .6rem; border-bottom:1px solid var(--border); }
table th { color:var(--ink-dim); font-weight:600; }
.view-client [data\2d internal] { display:none !important; }
@media print {
  header button, #controls, #modified-banner { display:none; }
  main { grid-template-columns:1fr; }
}
</style>
</head>
<body>
<header>
  <h1><!-- slot:TITLE --></h1>
  <span id="confidence-badge"></span>
  <button id="theme-toggle" type="button">theme</button>
  <!-- internal:start --><button id="view-toggle" type="button" data-internal>client view</button><!-- internal:end -->
</header>
<p id="modified-banner" hidden>modified from committed estimate — <button id="reset" type="button">reset</button></p>
<main>
  <section id="scenario-cards"></section>
  <!-- internal:start -->
  <aside id="controls" data-internal>
    <label>engineers <input id="ctl-engineers" type="number" min="1" max="8" step="1"></label>
    <label>seniority <select id="ctl-seniority"><option>junior</option><option>mid</option><option>senior</option></select></label>
    <label>claude plan <select id="ctl-plan"><option>none</option><option>max5x</option><option>max20x</option></select></label>
    <label>hourly rate <input id="ctl-rate" type="number" min="10" max="300" step="5"></label>
    <label>AI multiplier <input id="ctl-ai" type="range" min="0" max="1.5" step="0.05"></label>
    <label>risk buffer <input id="ctl-buffer" type="range" min="0" max="2" step="0.1"></label>
    <label>overhead % <input id="ctl-overhead" type="range" min="0" max="0.6" step="0.05"></label>
  </aside>
  <!-- internal:end -->
  <section id="cost-bars"></section>
  <section id="timeline"></section>
  <section id="feature-table"></section>
  <section id="register"></section>
</main>
<script type="application/json" id="estimation-data"><!-- slot:DATA --></script>
<script>
<!-- slot:MATH -->
/* boot: parse the data island, stamp the title + confidence badge, then wire
   the sections, what-if controls, and view/theme toggles. */
const DATA = JSON.parse(document.getElementById('estimation-data').textContent);
document.querySelector('header h1').textContent = DATA.inputs.project;
const confLevel = (c) => `conf-${c.toLowerCase()}`;
const badge = document.getElementById('confidence-badge');
badge.textContent = DATA.computed.projectConfidence;
badge.className = `${DATA.computed.projectConfidence.toLowerCase()} ${confLevel(DATA.computed.projectConfidence)}`;

// Same math path as the committed numbers: recompute() is both the page's
// what-if engine and the parity hook the browser tests call directly.
function recompute(p) {
  const tasks = DATA.inputs.features.flatMap((f) => f.tasks);
  const hoursOf = (t) => p.plan === 'none' ? pert(t).e
    : aiAdjust({ e: pert(t).e, category: t.category, seniority: p.seniority,
                 verificationPct: DATA.inputs.verificationPct, scale: p.aiScale });
  const dev = tasks.reduce((s, t) => s + hoursOf(t), 0);
  const buffers = (riskBufferHours(DATA.inputs.risks)
    + projectBuffer(tasks.map((t) => pert(t).sigma))) * p.bufferScale;
  const hours = dev + dev * p.overheadPct + buffers;
  const team = Array.from({ length: p.engineers }, () => ({ seniority: p.seniority, rate: p.rate }));
  return { hours, ...scenarioRollup({ hours, team, plan: p.plan }) };
}
window.__recompute = recompute;

const SENIORITY_RANK = { junior: 0, mid: 1, senior: 2 };
function dominantSeniority(team) {
  const counts = {};
  for (const m of team) counts[m.seniority] = (counts[m.seniority] ?? 0) + 1;
  let best = null;
  for (const s of Object.keys(counts)) {
    const better = !best || counts[s] > counts[best]
      || (counts[s] === counts[best] && SENIORITY_RANK[s] > SENIORITY_RANK[best]);
    if (better) best = s;
  }
  return best;
}

function defaultsFromRecommended() {
  const rec = DATA.inputs.scenarios.find((s) => s.id === DATA.inputs.recommendedScenario);
  return {
    engineers: rec.team.length,
    seniority: dominantSeniority(rec.team),
    plan: rec.plan,
    rate: rec.team[0].rate,
    aiScale: 1,
    bufferScale: 1,
    overheadPct: DATA.inputs.overheadPct,
  };
}

// Control ids are assembled at runtime (never one static "ctl-*" literal)
// so the client-only render, which keeps this whole script but drops the
// controls markup, never carries an internal control id as page text.
const CTL_SUFFIX = { engineers: 'engineers', seniority: 'seniority', plan: 'plan', rate: 'rate', aiScale: 'ai', bufferScale: 'buffer', overheadPct: 'overhead' };
const CTL_KEYS = Object.keys(CTL_SUFFIX);
const ctlId = (key) => `ctl-${CTL_SUFFIX[key]}`;

function setControls(values) {
  CTL_KEYS.forEach((key) => {
    const el = document.getElementById(ctlId(key));
    if (el) el.value = values[key];
  });
}

function currentParams(defaults) {
  const p = {};
  CTL_KEYS.forEach((key) => {
    const raw = document.getElementById(ctlId(key))?.value ?? defaults[key];
    p[key] = key === 'seniority' || key === 'plan' ? raw : Number(raw);
  });
  return p;
}

function barRow(label, value, max) {
  const pct = max > 0 ? Math.round((value / max) * 100) : 0;
  return `<div class="bar-row"><span class="bar-label">${label}</span>
    <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span></div>`;
}

function renderCards(custom) {
  const el = document.getElementById('scenario-cards');
  if (!el) return;
  const entries = [...Object.entries(DATA.computed.scenarios), ['custom (what-if)', custom]];
  el.innerHTML = entries.map(([id, s]) => `<div class="card"><h3>${id}${id === DATA.inputs.recommendedScenario ? ' (recommended)' : ''}</h3>
    <p>${s.months.toFixed(2)} mo &middot; $${Math.round(s.totalCost).toLocaleString()} &middot; ${s.hours.toFixed(1)}h</p></div>`).join('');
}

function renderBars(custom) {
  const el = document.getElementById('cost-bars');
  if (!el) return;
  const entries = [...Object.entries(DATA.computed.scenarios), ['custom', custom]];
  const max = Math.max(...entries.map(([, s]) => s.totalCost));
  el.innerHTML = entries.map(([id, s]) => barRow(id, s.totalCost, max)).join('');
}

function renderTimeline() {
  const el = document.getElementById('timeline');
  if (!el) return;
  const features = Object.entries(DATA.computed.features);
  const max = Math.max(...features.map(([, f]) => f.hours));
  el.innerHTML = features.map(([id, f]) => barRow(id, f.hours, max)).join('');
}

function renderTable() {
  const el = document.getElementById('feature-table');
  if (!el) return;
  const byId = Object.fromEntries(DATA.inputs.features.map((f) => [f.id, f]));
  const rows = Object.entries(DATA.computed.features).map(([id, f]) => {
    const input = byId[id];
    return `<tr><td>${input.name}</td><td>${f.hours}</td><td>${f.low}&ndash;${f.high}</td><td>${input.provenance}</td></tr>`;
  }).join('');
  el.innerHTML = `<table><thead><tr><th>Feature</th><th>Hours</th><th>Range</th><th>src</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// Assembled at runtime for the same reason as CTL_SUFFIX above: the task
// register is per-task WBS detail, not meant for the client view, so its
// wrapper carries the internal-hide attribute — but that attribute name must
// never appear as page text in a --client-only export.
const INTERNAL_ATTR = ['data', 'internal'].join('-');

function renderRegister() {
  const el = document.getElementById('register');
  if (!el) return;
  const taskRows = DATA.inputs.features.flatMap((f) => f.tasks).map((t) => `<tr class="${confLevel(t.confidence)}">
    <td>${t.name}</td><td>${t.category}</td><td>${t.confidence}</td><td>${t.assumptions.join('; ') || 'none'}</td></tr>`).join('');
  const riskRows = DATA.inputs.risks.map((r) => `<tr><td>${r.name}</td><td>${Math.round(r.probability * 100)}%</td><td>${r.impactHours}h</td></tr>`).join('');
  el.innerHTML = `<div ${INTERNAL_ATTR}><table><caption>Task register</caption><tbody>${taskRows}</tbody></table></div>
    <table><caption>Risk register</caption><tbody>${riskRows}</tbody></table>`;
}

function renderAll(defaults) {
  const custom = recompute(currentParams(defaults));
  renderCards(custom);
  renderBars(custom);
  renderTimeline();
  renderTable();
  renderRegister();
}

const defaults = defaultsFromRecommended();
setControls(defaults);
renderAll(defaults);

CTL_KEYS.forEach((key) => document.getElementById(ctlId(key))?.addEventListener('input', () => {
  renderAll(defaults);
  const banner = document.getElementById('modified-banner');
  if (banner) banner.hidden = false;
}));

document.getElementById('reset')?.addEventListener('click', () => {
  setControls(defaults);
  renderAll(defaults);
  const banner = document.getElementById('modified-banner');
  if (banner) banner.hidden = true;
});

document.getElementById('view-toggle')?.addEventListener('click', () => {
  document.body.classList.toggle('view-client');
});

document.getElementById('theme-toggle')?.addEventListener('click', () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
});
</script>
</body>
</html>
